<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Recebimento - Transpetro</title>
    <!-- Importando a biblioteca jsPDF e html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 90vh;
        }
        .container {
            max-width: 600px;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin: auto;
            flex: 1;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"], input[type="number"], select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        textarea {
            resize: vertical;
            height: 80px;
        }
        input:read-only {
            background-color: #e9ecef;
            color: #495057;
            cursor: not-allowed;
        }
        .inline-group {
            display: flex;
            gap: 10px;
        }
        .inline-group input {
            flex: 2;
        }
        .inline-group select {
            flex: 1;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .secao-motivo {
            display: none;
            background: #fdfefe;
            padding: 10px;
            border: 1px dashed #ccc;
            border-radius: 6px;
            margin-top: 10px;
        }
        #resultado {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            display: none;
        }
        .verde {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .vermelho {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        #btnPdfContainer {
            margin-top: 15px;
            display: none;
        }
        .btn-pdf {
            background-color: #dc3545;
        }
        .btn-pdf:hover {
            background-color: #bd2130;
        }
        footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #666;
            border-top: 1px solid #ddd;
            padding-top: 10px;
        }
    </style>
</head>
<body>

<div class="container" id="conteudoParaPrint">
    <h2>Controle de Recebimento de Estoque</h2>
    
    <div class="form-group">
        <label for="dataChecagem">Data da Checagem (Hoje):</label>
        <input type="text" id="dataChecagem" readonly>
    </div>

    <div class="form-group">
        <label for="motivoRecusa">Motivo / Tipo de Verificação:</label>
        <select id="motivoRecusa" onchange="alternarCamposMotivo()">
            <option value="validade">Validade de Estoque (Regra dos 70%)</option>
            <option value="partnumber">Part Number Incorreto ou Falta de Part Number</option>
            <option value="divergente">Material Divergente do Solicitante</option>
        </select>
    </div>

    <!-- Seção exclusiva para Validade -->
    <div id="blocoValidade" class="secao-motivo" style="display: block;">
        <div class="form-group">
            <label for="dataFabricacao">Data de Fabricação (DD/MM/AAAA):</label>
            <input type="text" id="dataFabricacao" placeholder="Ex: 01/01/2026">
        </div>
        <div class="form-group">
            <label>Tempo de Validade do Material:</label>
            <div class="inline-group">
                <input type="number" id="tempoValidade" placeholder="Ex: 5" min="1">
                <select id="tipoTempo">
                    <option value="anos">Anos</option>
                    <option value="meses">Meses</option>
                    <option value="dias">Dias</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Seção exclusiva para Material Divergente -->
    <div id="blocoDivergente" class="secao-motivo">
        <div class="form-group">
            <label for="detalhesDivergencia">Detalhe a Divergência Encontrada:</label>
            <textarea id="detalhesDivergencia" placeholder="Ex: O material entregue possui especificação técnica/medida diferente da solicitada."></textarea>
        </div>
    </div>

    <button onclick="processarAnalise()">Processar Análise</button>

    <div id="resultado"></div>

    <div id="btnPdfContainer">
        <button class="btn-pdf" onclick="gerarPDF()">Gerar PDF de Recusa Oficial</button>
    </div>
</div>

<footer>
    Sistema Automático de Recusa de Materiais — Criado por <strong>Dário João Torres</strong>. Todos os direitos reservados.
</footer>

<script>
    let dadosRelatorio = {};

    const dataAtualObj = new Date();
    dataAtualObj.setHours(0, 0, 0, 0);
    
    const diaFormatado = String(dataAtualObj.getDate()).padStart(2, '0');
    const mesFormatado = String(dataAtualObj.getMonth() + 1).padStart(2, '0');
    const anoFormatado = dataAtualObj.getFullYear();
    
    document.getElementById('dataChecagem').value = `${diaFormatado}/${mesFormatado}/${anoFormatado}`;

    function alternarCamposMotivo() {
        const tipo = document.getElementById('motivoRecusa').value;
        document.getElementById('blocoValidade').style.display = (tipo === 'validade') ? 'block' : 'none';
        document.getElementById('blocoDivergente').style.display = (tipo === 'divergente') ? 'block' : 'none';
        document.getElementById('resultado').style.display = 'none';
        document.getElementById('btnPdfContainer').style.display = 'none';
    }

    function converterParaDataJS(inputTexto) {
        if (!inputTexto) return null;
        inputTexto = inputTexto.trim();
        const regexBR = /^(\d{2})[\/\-](\d{2})[\/\-](\d{4})$/;
        if (regexBR.test(inputTexto)) {
            const partes = inputTexto.match(regexBR);
            return new Date(`${partes[3]}-${partes[2]}-${partes[1]}T00:00:00`);
        }
        const regexISO = /^(\d{4})[\/\-](\d{2})[\/\-](\d{2})$/;
        if (regexISO.test(inputTexto)) {
            const partes = inputTexto.match(regexISO);
            return new Date(`${partes[1]}-${partes[2]}-${partes[3]}T00:00:00`);
        }
        return null;
    }

    function formatarDataBR(data) {
        const d = String(data.getDate()).padStart(2, '0');
        const m = String(data.getMonth() + 1).padStart(2, '0');
        const a = data.getFullYear();
        return `${d}/${m}/${a}`;
    }

    function processarAnalise() {
        const tipo = document.getElementById('motivoRecusa').value;
        const resultadoDiv = document.getElementById('resultado');
        const btnPdfContainer = document.getElementById('btnPdfContainer');

        dadosRelatorio = { tipo: tipo, checagem: `${diaFormatado}/${mesFormatado}/${anoFormatado}` };

        if (tipo === 'validade') {
            const fabInput = document.getElementById('dataFabricacao').value;
            const tempoValor = parseInt(document.getElementById('tempoValidade').value);
            const tipoTempo = document.getElementById('tipoTempo').value;

            const dataFabricacao = converterParaDataJS(fabInput);
            if (!dataFabricacao || isNaN(dataFabricacao.getTime()) || isNaN(tempoValor) || tempoValor <= 0) {
                alert('Preencha a data de fabricação válida e o tempo de validade.');
                return;
            }

            if (dataAtualObj < dataFabricacao) {
                alert('A data de fabricação não pode ser futura.');
                return;
            }

            let dataValidade = new Date(dataFabricacao.getTime());
            if (tipoTempo === 'anos') dataValidade.setFullYear(dataValidade.getFullYear() + tempoValor);
            else if (tipoTempo === 'meses') dataValidade.setMonth(dataValidade.getMonth() + tempoValor);
            else if (tipoTempo === 'dias') dataValidade.setDate(dataValidade.getDate() + tempoValor);

            const msDia = 1000 * 60 * 60 * 24;
            const vidaUtilTotalDias = Math.round((dataValidade - dataFabricacao) / msDia);
            const vidaUtilRestanteDias = Math.round((dataValidade - dataAtualObj) / msDia);

            if (vidaUtilRestanteDias <= 0) {
                resultadoDiv.className = 'vermelho';
                resultadoDiv.innerHTML = 'Material Vencido! Recusar material.';
                resultadoDiv.style.display = 'block';
                btnPdfContainer.style.display = 'block';
                dadosRelatorio.detalhes = "Material vencido.";
                dadosRelatorio.percentual = 0;
                return;
            }

            const percentualRestante = (vidaUtilRestanteDias / vidaUtilTotalDias) * 100;
            dadosRelatorio.fabricacao = formatarDataBR(dataFabricacao);
            dadosRelatorio.validadeFinal = formatarDataBR(dataValidade);
            dadosRelatorio.totalDias = vidaUtilTotalDias;
            dadosRelatorio.restanteDias = vidaUtilRestanteDias;
            dadosRelatorio.percentual = percentualRestante.toFixed(2);

            resultadoDiv.style.display = 'block';
            if (percentualRestante >= 70) {
                resultadoDiv.className = 'verde';
                resultadoDiv.innerHTML = `Dentro da validade (${percentualRestante.toFixed(2)}% restante). Aceitar material.`;
                btnPdfContainer.style.display = 'none';
            } else {
                resultadoDiv.className = 'vermelho';
                resultadoDiv.innerHTML = `Fora dos 70% de validade (${percentualRestante.toFixed(2)}% restante). Recusar material.`;
                btnPdfContainer.style.display = 'block';
            }

        } else if (tipo === 'partnumber') {
            resultadoDiv.className = 'vermelho';
            resultadoDiv.innerHTML = 'Part Number incorreto ou ausente. Recusar material.';
            resultadoDiv.style.display = 'block';
            btnPdfContainer.style.display = 'block';

        } else if (tipo === 'divergente') {
            const textoDivergencia = document.getElementById('detalhesDivergencia').value.trim();
            if (!textoDivergencia) {
                alert('Por favor, descreva a divergência encontrada pelo solicitante.');
                return;
            }
            dadosRelatorio.textoDivergencia = textoDivergencia;
            resultadoDiv.className = 'vermelho';
            resultadoDiv.innerHTML = 'Material divergente do solicitado. Recusar material.';
            resultadoDiv.style.display = 'block';
            btnPdfContainer.style.display = 'block';
        }
    }

    async function gerarPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();

        // Cabeçalho institucional
        doc.setFont("helvetica", "bold");
        doc.setFontSize(11);
        doc.text("PETROBRAS TRANSPORTE S.A. — TRANSPETRO", 14, 15);
        doc.text("GERÊNCIA DE CONTROLE DE ESTOQUE E RECEBIMENTO DE MATERIAIS", 14, 22);

        doc.setLineWidth(0.5);
        doc.line(14, 26, 196, 26);

        doc.setFontSize(13);
        doc.setTextColor(180, 0, 0);
        doc.text("TERMO DE RECUSA DE RECEBIMENTO — NÃO CONFORMIDADE CONTRATUAL", 14, 36, { maxWidth: 182 });

        doc.setTextColor(0, 0, 0);
        doc.setFont("helvetica", "normal");
        doc.setFontSize(10);

        let textoCorpo = "";

        if (dadosRelatorio.tipo === 'validade') {
            textoCorpo = 
                "Comunicamos formalmente ao fornecedor que o lote de material apresentado para recebimento nesta unidade da Transpetro foi submetido à verificação de conformidade de vida útil.\n\n" +
                `Ficou constatado que o referido material não atingiu o patamar mínimo de 70% de validade remanescente exigido em contrato (apresentando apenas ${dadosRelatorio.percentual}%).\n\n` +
                "Desta forma, o recebimento do item fica rigorosamente recusado, procedendo-se com a devolução imediata ao fornecedor.";
        } else if (dadosRelatorio.tipo === 'partnumber') {
            textoCorpo = 
                "Comunicamos formalmente ao fornecedor que o material apresentado para recebimento nesta unidade da Transpetro foi recusado devido à incorreção ou ausência do Part Number (código de peça/identificação) obrigatório.\n\n" +
                "O item não atende aos requisitos de rastreabilidade e especificação técnica do contrato de fornecimento vigente, sendo devolvido.";
        } else if (dadosRelatorio.tipo === 'divergente') {
            textoCorpo = 
                "Comunicamos formalmente ao fornecedor que o material apresentado para recebimento nesta unidade da Transpetro foi recusado por apresentar divergência em relação ao que foi solicitado pelo requisitante.\n\n" +
                `Detalhamento da divergência apontada:\n"${dadosRelatorio.textoDivergencia}"\n\n` +
                "Desta forma, o recebimento é sumariamente recusado com devolução do item.";
        }

        doc.text(textoCorpo, 14, 46, { maxWidth: 182, lineHeightFactor: 1.3 });

        let yPosAssinatura = 135;
        if (dadosRelatorio.tipo === 'validade') {
            doc.setFont("helvetica", "bold");
            doc.setFontSize(10);
            doc.text("MEMÓRIA DE CÁLCULO E JUSTIFICATIVA TÉCNICA:", 14, 98);
            doc.setFont("helvetica", "normal");
            doc.setFontSize(9);
            doc.text(`• Fabricação: ${dadosRelatorio.fabricacao} | Vencimento Final: ${dadosRelatorio.validadeFinal}`, 14, 105);
            doc.text(`• Vida Útil Total: ${dadosRelatorio.totalDias} dias | Restante: ${dadosRelatorio.restanteDias} dias (${dadosRelatorio.percentual}%)`, 14, 112);
            yPosAssinatura = 145;
        }

        // Campos de Assinatura
        doc.setFont("helvetica", "bold");
        doc.setFontSize(10);
        doc.text("RESPONSÁVEL PELA INSPEÇÃO / RECEBIMENTO:", 14, yPosAssinatura);
        
        doc.setFont("helvetica", "normal");
        doc.text("Nome: ____________________________________________________", 14, yPosAssinatura + 10);
        doc.text("Matrícula: ________________________", 14, yPosAssinatura + 20);
        doc.text("Data da Recusa: ____/____/________", 14, yPosAssinatura + 30);

        // Captura da tela como anexo com ajuste de proporção para evitar cortes
        const elementoTela = document.getElementById('conteudoParaPrint');
        try {
            const canvas = await html2canvas(elementoTela, { scale: 1.5, logging: false });
            const imgData = canvas.toDataURL('image/png');

            doc.addPage();
            doc.setFont("helvetica", "bold");
            doc.setFontSize(12);
            doc.text("ANEXO: EVIDÊNCIA DA TELA DO SISTEMA", 14, 15);

            doc.setFont("helvetica", "normal");
            doc.setFontSize(10);
            doc.text("Registro visual extraído no ato da checagem para fins de apuração.", 14, 22);

            // Mantém a proporção correta para caber perfeitamente na página A4
            const imgProps = doc.getImageProperties(imgData);
            const pdfWidth = 180;
            const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;

            doc.addImage(imgData, 'PNG', 14, 28, pdfWidth, pdfHeight);
        } catch (erro) {
            console.error("Erro ao capturar evidência:", erro);
        }

        doc.save("termo_recusa_transpetro_oficial.pdf");
    }
</script>

</body>
</html>
