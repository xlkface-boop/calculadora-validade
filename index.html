<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Validade - Transpetro</title>
    <!-- Importando a biblioteca jsPDF e html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin: auto;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input:read-only {
            background-color: #e9ecef;
            color: #495057;
            cursor: not-allowed;
        }
        .inline-group {
            display: flex;
            gap: 10px;
        }
        .inline-group input {
            flex: 2;
        }
        .inline-group select {
            flex: 1;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        #resultado {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            display: none;
        }
        .verde {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .vermelho {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        #btnPdfContainer {
            margin-top: 15px;
            display: none;
        }
        .btn-pdf {
            background-color: #dc3545;
        }
        .btn-pdf:hover {
            background-color: #bd2130;
        }
    </style>
</head>
<body>

<div class="container" id="conteudoParaPrint">
    <h2>Validação de Materiais de Estoque</h2>
    
    <div class="form-group">
        <label for="dataChecagem">Data da Checagem (Hoje):</label>
        <input type="text" id="dataChecagem" readonly>
    </div>

    <div class="form-group">
        <label for="dataFabricacao">Data de Fabricação (DD/MM/AAAA ou AAAA-MM-DD):</label>
        <input type="text" id="dataFabricacao" placeholder="Ex: 01/01/2026 ou 2026-01-01">
    </div>

    <div class="form-group">
        <label>Tempo de Validade do Material:</label>
        <div class="inline-group">
            <input type="number" id="tempoValidade" placeholder="Ex: 5" min="1">
            <select id="tipoTempo">
                <option value="anos">Anos</option>
                <option value="meses">Meses</option>
                <option value="dias">Dias</option>
            </select>
        </div>
    </div>

    <button onclick="calcularValidade()">Calcular Validade</button>

    <div id="resultado"></div>

    <div id="btnPdfContainer">
        <button class="btn-pdf" onclick="gerarPDF()">Gerar PDF de Recusa com Prova de Cálculo</button>
    </div>
</div>

<script>
    // Variáveis globais para armazenar os dados do último cálculo bem-sucedido
    let dadosCalculo = {};

    const dataAtualObj = new Date();
    dataAtualObj.setHours(0, 0, 0, 0);
    
    const diaFormatado = String(dataAtualObj.getDate()).padStart(2, '0');
    const mesFormatado = String(dataAtualObj.getMonth() + 1).padStart(2, '0');
    const anoFormatado = dataAtualObj.getFullYear();
    
    document.getElementById('dataChecagem').value = `${diaFormatado}/${mesFormatado}/${anoFormatado}`;

    function converterParaDataJS(inputTexto) {
        if (!inputTexto) return null;
        inputTexto = inputTexto.trim();

        const regexBR = /^(\d{2})[\/\-](\d{2})[\/\-](\d{4})$/;
        if (regexBR.test(inputTexto)) {
            const partes = inputTexto.match(regexBR);
            return new Date(`${partes[3]}-${partes[2]}-${partes[1]}T00:00:00`);
        }

        const regexISO = /^(\d{4})[\/\-](\d{2})[\/\-](\d{2})$/;
        if (regexISO.test(inputTexto)) {
            const partes = inputTexto.match(regexISO);
            return new Date(`${partes[1]}-${partes[2]}-${partes[3]}T00:00:00`);
        }

        return null;
    }

    function formatarDataBR(data) {
        const d = String(data.getDate()).padStart(2, '0');
        const m = String(data.getMonth() + 1).padStart(2, '0');
        const a = data.getFullYear();
        return `${d}/${m}/${a}`;
    }

    function calcularValidade() {
        const fabInput = document.getElementById('dataFabricacao').value;
        const tempoValor = parseInt(document.getElementById('tempoValidade').value);
        const tipoTempo = document.getElementById('tipoTempo').value;
        const resultadoDiv = document.getElementById('resultado');
        const btnPdfContainer = document.getElementById('btnPdfContainer');

        const dataFabricacao = converterParaDataJS(fabInput);

        if (!dataFabricacao || isNaN(dataFabricacao.getTime()) || isNaN(tempoValor) || tempoValor <= 0) {
            alert('Por favor, digite uma data de fabricação válida (ex: 01/01/2026) e o tempo de validade.');
            return;
        }

        if (dataAtualObj < dataFabricacao) {
            alert('A data de fabricação não pode ser posterior à data atual de checagem.');
            return;
        }

        let dataValidade = new Date(dataFabricacao.getTime());
        if (tipoTempo === 'anos') {
            dataValidade.setFullYear(dataValidade.getFullYear() + tempoValor);
        } else if (tipoTempo === 'meses') {
            dataValidade.setMonth(dataValidade.getMonth() + tempoValor);
        } else if (tipoTempo === 'dias') {
            dataValidade.setDate(dataValidade.getDate() + tempoValor);
        }

        const msDia = 1000 * 60 * 60 * 24;
        const vidaUtilTotalDias = Math.round((dataValidade - dataFabricacao) / msDia);
        const vidaUtilRestanteDias = Math.round((dataValidade - dataAtualObj) / msDia);

        if (vidaUtilRestanteDias <= 0) {
            resultadoDiv.className = 'vermelho';
            resultadoDiv.innerHTML = 'Material Vencido! Recusar material.';
            resultadoDiv.style.display = 'block';
            btnPdfContainer.style.display = 'block';
            dadosCalculo = { fabricacao: formatarDataBR(dataFabricacao), validadeFinal: formatarDataBR(dataValidade), checagem: formatarDataBR(dataAtualObj), totalDias: vidaUtilTotalDias, restanteDias: vidaUtilRestanteDias, percentual: 0 };
            return;
        }

        const percentualRestante = (vidaUtilRestanteDias / vidaUtilTotalDias) * 100;

        // Salva os dados para o PDF
        dadosCalculo = {
            fabricacao: formatarDataBR(dataFabricacao),
            validadeFinal: formatarDataBR(dataValidade),
            checagem: formatarDataBR(dataAtualObj),
            totalDias: vidaUtilTotalDias,
            restanteDias: vidaUtilRestanteDias,
            percentual: percentualRestante.toFixed(2)
        };

        resultadoDiv.style.display = 'block';

        if (percentualRestante >= 70) {
            resultadoDiv.className = 'verde';
            resultadoDiv.innerHTML = `Dentro da validade (${percentualRestante.toFixed(2)}% restante). Aceitar material.`;
            btnPdfContainer.style.display = 'none';
        } else {
            resultadoDiv.className = 'vermelho';
            resultadoDiv.innerHTML = `Fora dos 70% de validade (${percentualRestante.toFixed(2)}% restante). Recusar material.`;
            btnPdfContainer.style.display = 'block';
        }
    }

    async function gerarPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();

        // 1. Cabeçalho institucional corporativo
        doc.setFont("helvetica", "bold");
        doc.setFontSize(11);
        doc.text("PETROBRAS TRANSPORTE S.A. — TRANSPETRO", 14, 15);
        doc.text("GERÊNCIA DE CONTROLE DE ESTOQUE E RECEBIMENTO DE MATERIAIS", 14, 22);

        doc.setLineWidth(0.5);
        doc.line(14, 26, 196, 26);

        doc.setFontSize(13);
        doc.setTextColor(180, 0, 0);
        doc.text("TERMO DE RECUSA DE RECEBIMENTO — NÃO CONFORMIDADE CONTRATUAL", 14, 36, { maxWidth: 182 });

        doc.setTextColor(0, 0, 0);
        doc.setFont("helvetica", "normal");
        doc.setFontSize(10);

        const textoCorpo = 
            "Comunicamos formalmente ao fornecedor que o lote de material apresentado para recebimento nesta unidade da Transpetro foi submetido à verificação de conformidade de vida útil.\n\n" +
            "Ficou constatado que o referido material não atingiu o patamar mínimo de 70% (setenta por cento) de validade remanescente, percentual este estipulado de forma obrigatória nas cláusulas gerais do contrato de fornecimento vigente.\n\n" +
            "Desta forma, o recebimento do item fica rigorosamente recusado por descumprimento das diretrizes contratuais de estocagem e garantia. O material encontra-se disponível para os trâmites de devolução ao fornecedor.";

        doc.text(textoCorpo, 14, 46, { maxWidth: 182, lineHeightFactor: 1.3 });

        // 2. Quadro com a Memória de Cálculo e Justificativa Técnica (Prova do Cálculo)
        doc.setFont("helvetica", "bold");
        doc.setFontSize(11);
        doc.text("MEMÓRIA DE CÁLCULO E JUSTIFICATIVA TÉCNICA (AUDITORIA)", 14, 96);

        doc.setFont("helvetica", "normal");
        doc.setFontSize(9.5);
        const yCalc = 102;
        doc.text(`• Data de Fabricação do Material: ${dadosCalculo.fabricacao}`, 14, yCalc + 6);
        doc.text(`• Data de Vencimento Final (Fabricação + Prazo): ${dadosCalculo.validadeFinal}`, 14, yCalc + 13);
        doc.text(`• Data de Recebimento / Checagem no Estoque: ${dadosCalculo.checagem}`, 14, yCalc + 20);
        doc.text(`• Vida Útil Total de Fábrica: ${dadosCalculo.totalDias} dias (100%)`, 14, yCalc + 27);
        doc.text(`• Vida Útil Restante no Recebimento: ${dadosCalculo.restanteDias} dias`, 14, yCalc + 34);
        doc.text(`• Percentual Calculado: ${dadosCalculo.percentual}% de validade remanescente`, 14, yCalc + 41);

        doc.setFont("helvetica", "bold");
        doc.text(`> CRITÉRIO APLICADO: O contrato exige no mínimo 70%. Como o material apresentou ${dadosCalculo.percentual}%, a recusa é mandatória.`, 14, yCalc + 50, { maxWidth: 182 });

        // Campos de Assinatura
        const yPos = 165;
        doc.setFont("helvetica", "bold");
        doc.setFontSize(10);
        doc.text("RESPONSÁVEL PELA INSPEÇÃO / RECEBIMENTO:", 14, yPos);
        
        doc.setFont("helvetica", "normal");
        doc.text("Nome: ____________________________________________________", 14, yPos + 10);
        doc.text("Matrícula: ________________________", 14, yPos + 20);
        doc.text("Data da Recusa: ____/____/________", 14, yPos + 30);

        // 3. Captura da tela do sistema como evidência na segunda página
        const elementoTela = document.getElementById('conteudoParaPrint');
        
        try {
            const canvas = await html2canvas(elementoTela, { scale: 2 });
            const imgData = canvas.toDataURL('image/png');

            doc.addPage();
            doc.setFont("helvetica", "bold");
            doc.setFontSize(12);
            doc.text("ANEXO: EVIDÊNCIA DA TELA DO SISTEMA", 14, 15);

            doc.setFont("helvetica", "normal");
            doc.setFontSize(10);
            doc.text("Registro visual extraído no ato da checagem para fins de apuração.", 14, 22);

            doc.addImage(imgData, 'PNG', 14, 28, 180, 0);
        } catch (erro) {
            console.error("Erro ao capturar evidência da tela:", erro);
        }

        doc.save("termo_recusa_transpetro_com_memoria_calculo.pdf");
    }
</script>

</body>
</html>
